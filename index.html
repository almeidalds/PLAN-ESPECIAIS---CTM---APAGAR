
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planejamentos Especiais</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/YY2QgiU.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', "Liberation Mono", "Courier New", 'monospace'],
          },
          extend: {
            colors: {
              background: '#F3F6FD', // Light Blue-Grey Background from image
              bg: '#F3F6FD', // Alias for background
              surface: '#FFFFFF',
              surfaceHighlight: '#F8FAFC',
              txt: {
                primary: '#1E293B', // Slate 800
                secondary: '#64748B', // Slate 500
                muted: '#94A3B8',
              },
              brand: {
                50: '#EFF6FF',
                100: '#DBEAFE',
                200: '#BFDBFE',
                300: '#93C5FD',
                400: '#60A5FA',
                500: '#3B82F6', // Vibrant Blue
                600: '#2563EB',
                700: '#1D4ED8',
                800: '#1E40AF',
                900: '#1E3A8A',
              },
            },
            boxShadow: {
              'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
              'soft-lg': '0 10px 40px -5px rgba(0, 0, 0, 0.08)',
              'soft-sm': '0 2px 10px -1px rgba(0, 0, 0, 0.05)',
              'float': '0 8px 30px rgba(0,0,0,0.12)',
              'glow': '0 0 15px rgba(59, 130, 246, 0.5)',
            },
            borderRadius: {
              '3xl': '1.5rem',
              '4xl': '2rem',
            },
            animation: {
              'fade-in': 'fadeIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards',
              'fade-in-up': 'fadeInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards',
              'slide-up': 'slideUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards',
              'page-enter': 'pageEnter 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'scale(0.98)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              pageEnter: {
                '0%': { opacity: '0', transform: 'translateY(8px) scale(0.99)' },
                '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body { 
        background-color: #F3F6FD;
        color: #1E293B;
      }
      
      .dark body {
        background-color: #0F172A;
        color: #F8FAFC;
      }
      
      /* Soft UI Card Class */
      .soft-card {
        background-color: #FFFFFF;
        border-radius: 1.75rem; 
        box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
        border: none;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.3s;
      }
      
      .dark .soft-card {
        background-color: #1E293B;
        box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
      }
      
      .soft-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
      }
      .dark .soft-card:hover {
        box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
      }

      /* Buttons & Soft Buttons */
      .btn, .soft-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.75rem 1.5rem;
        font-weight: 700;
        border-radius: 1rem;
        transition: all 0.2s;
        cursor: pointer;
        font-size: 0.875rem;
        background-color: #FFFFFF;
        color: #64748B;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      }
      
      .dark .btn, .dark .soft-btn {
        background-color: #334155;
        color: #CBD5E1;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      }

      .btn:hover, .soft-btn:hover {
        background-color: #F8FAFC;
        color: #3B82F6;
      }
      
      .dark .btn:hover, .dark .soft-btn:hover {
        background-color: #475569;
        color: #60A5FA;
      }

      .btn-primary, .soft-btn-primary {
        background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
        color: white !important;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      }
      .btn-primary:hover, .soft-btn-primary:hover {
        box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
        transform: translateY(-1px);
        background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
      }

      /* Inputs (Fixes Dark Date Picker on Light Mode) */
      .input-field, .soft-input {
        width: 100%;
        background-color: #F1F5F9; /* Slate 100 */
        border: 2px solid transparent;
        color: #1E293B;
        border-radius: 1rem;
        padding: 0.75rem 1.25rem;
        font-size: 0.875rem;
        font-weight: 600;
        transition: all 0.2s;
        outline: none;
        color-scheme: light; /* CRITICAL: Forces light calendar picker */
      }
      .input-field:focus, .soft-input:focus {
        background-color: #FFFFFF;
        border-color: #3B82F6;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
      }
      
      /* Dark Mode for Inputs */
      .dark .input-field, .dark .soft-input {
        background-color: #0F172A; /* Slate 900 */
        color: #F8FAFC;
        color-scheme: dark; /* CRITICAL: Forces dark calendar picker */
        border-color: #334155;
      }
      .dark .input-field:focus, .dark .soft-input:focus {
        border-color: #60A5FA;
        box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.1);
      }

      /* Soft Icons */
      .soft-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #EFF6FF;
        border-radius: 2rem;
      }
      .dark .soft-icon {
        background-color: rgba(59, 130, 246, 0.1);
      }

      /* Scrollbar */
      .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
      
      .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #64748B; }

      @media print {
        body { background: white; }
        .soft-card { box-shadow: none; border: 1px solid #ddd; }
        .no-print { display: none !important; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "xlsx": "https://esm.sh/xlsx@0.18.5",
    "jszip": "https://esm.sh/jszip@3.10.1",
    "jspdf": "https://esm.sh/jspdf@2.5.1",
    "jspdf-autotable": "https://esm.sh/jspdf-autotable@3.8.2"
  }
}
</script>
</head>
  <body class="antialiased h-screen overflow-hidden selection:bg-brand-500 selection:text-white bg-bg dark:bg-slate-900 transition-colors duration-300">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
